<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZORT CEZA MERKEZİ</title>
    <style>
        body { background: #000; color: #ff3333; text-align: center; font-family: sans-serif; }
        .warning { font-size: 40px; margin-top: 100px; animation: blink 0.3s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="warning">SİSTEM ZORTLANDI!</div>
    <p>Kara listede olduğun için sürgün edildin.</p>
    <button onclick="baslat()" style="padding:15px; background:red; color:white; border:none; cursor:pointer;">KURTULMAYI DENE</button>

    <script>
        acYeniPencere();
        let pencereler = [];

        function baslat() {
            for(let i = 0; i < 6; i++) {
                acYeniPencere();
            }
        }

        function acYeniPencere() {
            let w = 450;
            let h = 350;
            let x = Math.random() * (window.screen.width - w);
            let y = Math.random() * (window.screen.height - h);
            
            let win = window.open("", "_blank", `width=${w},height=${h},left=${x},top=${y}`);
            pencereler.push(win);

            if (win) {
                win.document.write(`
                    <body style="background:black; color:white; text-align:center; font-family:sans-serif; overflow:hidden;">
                        <h2 style="color:yellow;">AFFEDİLMEYİ DİLE!</h2>
                        <p>Aşağıya bunlardan birini yaz: "özür dilerim", "özür", "zort", "i ❤ zort", "özür zort", "özür dilerim zort", "zortmen", "zort ailesini seviyorum"</p>
                        <input type="text" id="ozurInput" placeholder="Buraya yaz..." style="padding:10px; width:80%;">
                        <button onclick="kontrol()" style="margin-top:10px; padding:10px; background:green; color:white; border:none; cursor:pointer;">GÖNDER</button>
                        
                        <script>
                            function kontrol() {
                                const kelimeler = ["özür dilerim", "özür", "zort", "i ❤ zort", "özür zort", "özür dilerim zort", "zortmen", "zort ailesini seviyorum"];
                                const deger = document.getElementById('ozurInput').value.toLowerCase();
                                
                                if(kelimeler.includes(deger)) {
                                    alert("ÖZÜR KABUL EDİLDİ. SERBESTSİN.");
                                    window.opener.herSeyiKapat();
                                } else {
                                    alert("BU ÖZÜR SAMİMİ DEĞİL! DAHA ÇOK ZORTLANACAKSIN!");
                                    window.opener.acYeniPencere(); // Yanlış yazarsa bir tane daha aç!
                                }
                            }

                            // Ekranda zıplama hareketi
                            let dx = 8, dy = 8;
                            setInterval(() => {
                                window.moveBy(dx, dy);
                                if (window.screenX < 0 || window.screenX > screen.width - 450) dx = -dx;
                                if (window.screenY < 0 || window.screenY > screen.height - 350) dy = -dy;
                            }, 40);
                        <\/script>
                    </body>
                `);
            }
        }

        function herSeyiKapat() {
            pencereler.forEach(p => {
                if(!p.closed) p.close();
            });
            alert("BÜTÜN ZORTLAR TEMİZLENDİ. BİR DAHA HATA YAPMA!");
            window.location.href = "index.html"; // Ana sayfaya geri döndür
        }
    </script>
</body>
</html>
