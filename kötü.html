<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZORT CEZA MERKEZİ</title>
    <style>
        body { background: #000; color: #ff3333; text-align: center; font-family: sans-serif; }
        .warning { font-size: 40px; margin-top: 100px; animation: blink 0.3s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="warning">SİSTEM ZORTLANDI!</div>
    <p>Kara listede olduğun için sürgün edildin.</p>
    <button onclick="baslat()" style="padding:15px; background:red; color:white; border:none; cursor:pointer;">KURTULMAYI DENE</button>

    <script>
        acYeniPencere();
       let pencereler = [];
let zorlaKapat = false; // Özür dileyince sistemi durdurmak için anahtar

function baslat() {
    zorlaKapat = false;
    for(let i = 0; i < 5; i++) {
        acYeniPencere();
    }
}

function acYeniPencere() {
    if(zorlaKapat) return; // Eğer affedildiyse yeni pencere açma

    let w = 450;
    let h = 350;
    let x = Math.random() * (window.screen.width - w);
    let y = Math.random() * (window.screen.height - h);
    
    let win = window.open("", "_blank", `width=${w},height=${h},left=${x},top=${y}`);
    
    if (win) {
        pencereler.push(win);

        // KAPANMAYA KARŞI ÖNLEM:
        // Pencere kapandığında (unload) ana sayfaya haber ver ve yenisini açtır
        win.onunload = function() {
            if(!zorlaKapat) {
                setTimeout(acYeniPencere, 100); // 0.1 saniye sonra hortla!
            }
        };

        win.document.write(`
            <body style="background:red; color:white; text-align:center; font-family:sans-serif; overflow:hidden;">
                <h2 style="background:yellow; color:black;">ZORT HAPSİ!</h2>
                <p>Kaçamazsın! Özür metnini yaz:</p>
                <input type="text" id="ozurInput" placeholder="Buraya yaz..." style="padding:10px; width:80%;">
                <br><br>
                <button onclick="kontrol()" style="padding:10px 20px; background:black; color:white; border:none; cursor:pointer; font-weight:bold;">AF DİLE</button>
                
                <script>
                    function kontrol() {
                        const kelimeler = ["özür dilerim", "özür", "zort", "i ❤ zort", "özür zort"];
                        const deger = document.getElementById('ozurInput').value.toLowerCase();
                        
                        if(kelimeler.includes(deger)) {
                            window.opener.herSeyiKapat();
                        } else {
                            alert("YANLIŞ KELİME! CEZAN ARTIYOR!");
                            window.opener.acYeniPencere(); // Yanlış yazana bir tane daha!
                        }
                    }

                    // Zıplama Efekti
                    let dx = 10, dy = 10;
                    setInterval(() => {
                        window.moveBy(dx, dy);
                        if (window.screenX < 0 || window.screenX > screen.width - 450) dx = -dx;
                        if (window.screenY < 0 || window.screenY > screen.height - 350) dy = -dy;
                    }, 30);
                <\/script>
            </body>
        `);
    }
}

function herSeyiKapat() {
    zorlaKapat = true; // Hortlama mekanizmasını durdur
    pencereler.forEach(p => {
        try { p.close(); } catch(e) {}
    });
    alert("Zortmen seni affetti. Şansını zorlama!");
    window.location.href = "index.html"; 
}
    </script>
</body>
</html>
