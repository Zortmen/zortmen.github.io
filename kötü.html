<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zortmen - KARA LİSTE</title>
    <style>
        body {
            background-color: #0a0000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #status {
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #550000;
        }

        /* Kaçan Buton Tasarımı */
        #escape-btn {
            position: absolute;
            padding: 15px 30px;
            background: #222;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease; /* Hafif bir akıcılık ama basması zor */
            z-index: 1000;
        }

        .lag-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="status">KARA LİSTE: ERİŞİM YOK</div>
    <p>Affedilmek için butonu yakala!</p>

    <button id="escape-btn">ÖZÜR DİLERİM</button>

    <script>
        let isPunishing = true;
        const btn = document.getElementById('escape-btn');

        // --- 1. FPS DÜŞÜRÜCÜ (8 FPS HEDEFİ) ---
        function applyLag() {
            if (!isPunishing) return;
            const start = performance.now();
            while (performance.now() - start < 110) { 
                // CPU'yu 110ms kilitliyoruz -> ~8-9 FPS
                Math.sqrt(Math.random() * 999);
            }
            requestAnimationFrame(applyLag);
        }

        // --- 2. KAÇAN BUTON MEKANİZMASI ---
        document.addEventListener('mousemove', (e) => {
            if (!isPunishing) return;

            const btnRect = btn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            // Fare ile buton merkezi arasındaki mesafe
            const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

            // Eğer 10px (veya butonun yakınına) yaklaşırsak kaç
            if (distance < 80) { // 10px çok dar olduğu için 80px civarı etkileşime sokup kaçırıyoruz
                const newX = Math.random() * (window.innerWidth - btnRect.width);
                const newY = Math.random() * (window.innerHeight - btnRect.height);
                
                btn.style.left = newX + 'px';
                btn.style.top = newY + 'px';
            }
        });

        // --- 3. KURTULUŞ ---
        btn.addEventListener('click', () => {
            isPunishing = false;
            alert("Affedildin. Ana sayfaya yönlendiriliyorsun...");
            window.location.href = "https://zortmen.github.io"; 
        });

        // Başlat
        window.onload = () => {
            // Butonu rastgele bir yere koy
            btn.style.left = '50%';
            btn.style.top = '70%';
            applyLag();
        };
    </script>
</body>
</html>
