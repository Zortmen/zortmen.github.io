<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zort Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; touch-action: none; }
        #setup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.95); padding: 30px; border-radius: 20px; z-index: 1000; text-align: center; border: 4px solid #e67e22; box-shadow: 0 0 25px #e67e22; }
        #gameCanvas { background: linear-gradient(#0f0c29, #302b63, #24243e); display: block; width: 100vw; height: 60vh; }
        #chat-area { height: 12vh; background: rgba(0,0,0,0.9); overflow-y: auto; padding: 10px; font-size: 13px; border-top: 2px solid #444; color: #fff; }
        #chat-input-area { height: 6vh; display: flex; background: #222; }
        #chat-input { flex: 1; padding: 10px; border: none; background: #111; color: #e67e22; font-weight: bold; }
        #controls { height: 22vh; display: flex; justify-content: space-around; align-items: center; background: #111; padding: 0 10px; }
        .btn { width: 85px; height: 85px; background: #444; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; user-select: none; border-bottom: 6px solid #000; -webkit-user-select: none; touch-action: none; }
        .btn:active { background: #666; border-bottom: 2px solid #000; transform: translateY(4px); }
        .btn.jump { background: #f1c40f; width: 100px; height: 100px; }
        button { padding: 12px 25px; background: #e67e22; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #level-ui { position: absolute; top: 10px; left: 10px; font-size: 20px; color: #f1c40f; text-shadow: 2px 2px #000; z-index: 5; }
    </style>
</head>
<body>
<div id="level-ui">Level: 1</div>
<div id="setup">
    <h1 style="color: #e67e22; margin-top: 0;">SONSUZ MACERA</h1>
    <div id="my-id-box" style="margin-bottom: 15px; font-size: 18px; background: #333; padding: 10px; border-radius: 8px;">ID Alınıyor...</div>
    <input type="text" id="peer-id-input" placeholder="Arkadaşının ID'si" style="padding: 10px; margin-bottom: 10px; text-align: center;"><br>
    <input type="text" id="usernameInput" placeholder="Lakabını yaz...">
    <button onclick="connectToPeer()">DÜNYAYA KATIL</button>
</div>

<canvas id="gameCanvas"></canvas>
<div id="chat-area"></div>
<div id="chat-input-area">
    <input type="text" id="chat-input" placeholder="Mesaj yaz ve Enter'a bas...">
    <button id="sendBtn" style="width: 80px; background: #d35400;">GÖNDER</button>
</div>

<div id="controls">
    <div class="btn" id="btnLeft">←</div>
    <div class="btn jump" id="btnUp">↑</div>
    <div class="btn" id="btnRight">→</div>
</div>

<script>
function generateShortID() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 5; i++) { result += chars.charAt(Math.floor(Math.random() * chars.length)); }
    return 'zort2087-' + result;
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const chatArea = document.getElementById('chat-area');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('sendBtn');
canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.6;

const myCustomID = generateShortID();
let peer = new Peer(myCustomID);
let conn;
const gravity = 0.8;
const friction = 0.85;
let cameraX = 0;
let currentLevel = 1;
let gameOver = false;

let players = {
    self: { x: 100, y: 100, vX: 0, vY: 0, color: '#3498db', rotation: 0, isFlipping: false, ground: false, jumpCount: 0, name: '' },
    other: { x: -500, y: -500, color: '#e74c3c', rotation: 0, name: '' }
};

let seed = 12345;
function seededRandom() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}

let worldItems = { platforms: [], lava: [], spikes: [], finishLine: null };
let lastX = 0;

function generateChunk(startX, width) {
    let x = startX;
    worldItems.platforms.push({ x: startX, y: canvas.height - 40, w: width, h: 40, isGround: true });
    while (x < startX + width - 400) {
        let gap = 150 + seededRandom() * 150;
        let pW = 200 + seededRandom() * 200;
        let pY = canvas.height - (150 + seededRandom() * 200);
        worldItems.platforms.push({ x: x + gap, y: pY, w: pW, h: 30 });
        if (seededRandom() > 0.6) worldItems.spikes.push({ x: x + gap + (pW / 2) - 15, y: pY - 20, w: 30, h: 20 });
        if (seededRandom() > 0.7) worldItems.lava.push({ x: x + gap - 100, y: canvas.height - 60, w: 100, h: 25 });
        x += gap + pW;
    }
    worldItems.finishLine = { x: startX + width - 100, y: 0, w: 20, h: canvas.height };
    lastX = startX + width;
}

generateChunk(0, 5000);

peer.on('open', id => document.getElementById('my-id-box').innerText = "ID: " + id);
peer.on('connection', c => { conn = c; setupConnection(); });

function connectToPeer() {
    let id = document.getElementById('peer-id-input').value;
    if(id) { conn = peer.connect(id); setupConnection(); }
}

function addChatMessage(msg, type) {
    let div = document.createElement('div');
    div.style.padding = "2px 0";
    div.style.color = type === 'me' ? '#3498db' : '#e74c3c';
    div.innerText = (type === 'me' ? "Sen: " : "Rakip: ") + msg;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function sendMessage() {
    let msg = chatInput.value.trim();
    if(msg && conn && conn.open) {
        conn.send({ type: 'chat', msg: msg });
        addChatMessage(msg, 'me');
        chatInput.value = '';
    }
}

sendBtn.onclick = sendMessage;
chatInput.onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };

function setupConnection() {
    conn.on('open', () => {
        players.self.name = document.getElementById('usernameInput').value || "Oyuncu";
        document.getElementById('setup').style.display = 'none';
        setInterval(() => {
            if(conn && conn.open) {
                // Konumu ekranın altına göre normalize et
                let relY = canvas.height - players.self.y;
                conn.send({ type: 'sync', x: players.self.x, relY: relY, rot: players.self.rotation, name: players.self.name, level: currentLevel });
            }
        }, 16);
    });

    conn.on('data', data => {
        if(data.type === 'sync') {
            players.other.x = data.x;
            // Karşı tarafın gönderdiği "alt hiza" bilgisini kendi ekranına göre ayarla
            players.other.y = canvas.height - data.relY;
            players.other.rotation = data.rot;
            players.other.name = data.name;
            if(data.level > currentLevel) nextLevel();
        }
        if(data.type === 'chat') addChatMessage(data.msg, 'them');
    });
}

const keys = { left: false, right: false };
function handleJump() {
    let p = players.self;
    if (p.ground) { p.vY = -16; p.ground = false; p.jumpCount = 1; p.isFlipping = true; }
    else if (p.jumpCount < 2) { p.vY = -14; p.jumpCount = 2; p.rotation = 0; p.isFlipping = true; }
}

function nextLevel() {
    if(currentLevel >= 10) { gameOver = true; return; }
    currentLevel++;
    document.getElementById('level-ui').innerText = "Level: " + currentLevel;
    players.self.x = 100; players.self.y = 100;
    worldItems = { platforms: [], lava: [], spikes: [], finishLine: null };
    seed += currentLevel; 
    generateChunk(0, 5000);
}

function update() {
    if(gameOver) return;
    let p = players.self;
    if (keys.left) p.vX = -7; else if (keys.right) p.vX = 7; else p.vX *= friction;
    p.vY += gravity; p.x += p.vX; p.y += p.vY;

    if(players.other.x !== -500) {
        let dist = p.x - players.other.x;
        if (dist > 800) p.x = players.other.x + 800;
        if (dist < -800) p.x = players.other.x - 800;
    }

    if (p.isFlipping) {
        p.rotation += 0.15;
        if (p.rotation >= Math.PI * 2) { p.rotation = 0; p.isFlipping = false; }
    }
    p.ground = false;
    worldItems.platforms.forEach(plat => {
        if (p.x + 50 > plat.x && p.x < plat.x + plat.w && p.y + 50 > plat.y && p.y + 50 < plat.y + 30 && p.vY > 0) {
            p.y = plat.y - 50; p.vY = 0; p.ground = true; p.jumpCount = 0; p.rotation = 0; p.isFlipping = false;
        }
    });
    [...worldItems.lava, ...worldItems.spikes].forEach(h => {
        if (p.x + 40 > h.x && p.x < h.x + h.w && p.y + 40 > h.y && p.y < h.y + h.h) {
            p.x = 100; p.y = 100; p.vX = 0; p.vY = 0;
        }
    });

    if(worldItems.finishLine && p.x > worldItems.finishLine.x) { nextLevel(); }
    if (p.y > canvas.height) { p.x = 100; p.y = 100; p.vY = 0; }
    
    cameraX = p.x - 200;
    if (cameraX < 0) cameraX = 0;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(gameOver) {
        ctx.fillStyle = "white"; ctx.font = "40px Arial"; ctx.textAlign = "center";
        ctx.fillText("OYUN BİTTİ - TEBRİKLER!", canvas.width/2, canvas.height/2);
        return;
    }
    ctx.save();
    ctx.translate(-cameraX, 0);
    
    if(worldItems.finishLine) {
        ctx.fillStyle = "#f1c40f"; ctx.fillRect(worldItems.finishLine.x, 0, 10, canvas.height);
        ctx.fillStyle = "white"; ctx.font = "20px Arial";
        ctx.fillText("BİTİŞ", worldItems.finishLine.x - 20, 50);
    }

    ctx.fillStyle = "#ff4500";
    worldItems.lava.forEach(l => { ctx.fillRect(l.x, l.y, l.w, l.h); });
    worldItems.platforms.forEach(p => {
        ctx.fillStyle = p.isGround ? "#1a1a1a" : "#444"; 
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#2ecc71"; ctx.fillRect(p.x, p.y, p.w, 6);
    });
    ctx.fillStyle = "#bdc3c7";
    worldItems.spikes.forEach(s => {
        ctx.beginPath(); ctx.moveTo(s.x, s.y + s.h); ctx.lineTo(s.x + s.w / 2, s.y); ctx.lineTo(s.x + s.w, s.y + s.h); ctx.fill();
    });

    [players.self, players.other].forEach(p => {
        if(p.name) {
            ctx.fillStyle = "white"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x + 25, p.y - 15);
        }
        ctx.save();
        ctx.translate(p.x + 25, p.y + 25);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color; ctx.fillRect(-25, -25, 50, 50);
        ctx.fillStyle = "white"; ctx.fillRect(-15, -15, 10, 10); ctx.fillRect(5, -15, 10, 10);
        ctx.restore();
    });

    ctx.restore();
    update();
    requestAnimationFrame(draw);
}

const bindBtn = (id, keyName) => {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); if(keyName === 'up') handleJump(); else keys[keyName] = true; };
    const end = (e) => { e.preventDefault(); if(keyName !== 'up') keys[keyName] = false; };
    el.addEventListener('touchstart', start, {passive: false});
    el.addEventListener('touchend', end, {passive: false});
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end); el.addEventListener('mouseleave', end);
};
bindBtn('btnLeft', 'left'); bindBtn('btnRight', 'right'); bindBtn('btnUp', 'up');

window.onkeydown = e => {
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
    if(e.key === 'w' || e.key === ' ' || e.key === 'ArrowUp') handleJump();
};
window.onkeyup = e => {
    if(e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if(e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
};

draw();
</script>
</body>
</html>
