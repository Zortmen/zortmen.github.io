<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zort Multiplayer Pro - Level 15</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #setup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30, 30, 40, 0.98); padding: 30px; border-radius: 25px; z-index: 1000; text-align: center; border: 4px solid #3498db; width: 300px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        #gameCanvas { background: linear-gradient(#1a2a6c, #b21f1f, #fdbb2d); display: block; width: 100vw; height: 60vh; border-bottom: 2px solid #333; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 5; pointer-events: none; width: 100%; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 10px; border-left: 4px solid #f1c40f; font-weight: bold; margin-bottom: 5px; display: inline-block; pointer-events: none; }
        #chat-container { position: absolute; top: 100px; left: 10px; width: 250px; height: 150px; background: rgba(0,0,0,0.5); border-radius: 10px; display: flex; flex-direction: column; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2); }
        #chat-messages { flex: 1; overflow-y: auto; padding: 5px; font-size: 12px; color: #fff; text-shadow: 1px 1px 1px #000; }
        #chat-input { background: rgba(0,0,0,0.8); border: none; color: white; padding: 10px; flex: 1; outline: none; font-size: 14px; }
        #chat-send-btn { width: 80px; height: 40px; background: #3498db; color: white; border: none; border-radius: 0 0 10px 0; font-weight: bold; cursor: pointer; }
        #controls { height: 40vh; display: flex; justify-content: center; gap: 20px; align-items: center; background: #111; }
        .btn { width: 80px; height: 80px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; border-bottom: 6px solid #000; touch-action: none; user-select: none; }
        .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
        .jump-btn { background: #e74c3c; width: 100px; height: 100px; font-weight: bold; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #222; color: #fff; }
        button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="stat-box" id="level-display">LEVEL: 1</div>
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div style="display: flex;">
            <input type="text" id="chat-input" placeholder="Mesaj yaz...">
            <button id="chat-send-btn">GÖNDER</button>
        </div>
    </div>
</div>

<div id="setup">
    <h2 style="color: #3498db;">ZORT MULTIPLAYER</h2>
    <div id="my-id-box" style="font-size: 11px; color: #aaa; margin-bottom: 10px;">ID Hazırlanıyor...</div>
    <input type="text" id="usernameInput" placeholder="İsminiz...">
    <input type="text" id="peer-id-input" placeholder="Bağlanılacak ID">
    <button onclick="startGame()">BAŞLAT</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
    <div class="btn" id="btnLeft">←</div>
    <div class="btn jump-btn" id="btnUp">ZIPLA</div>
    <div class="btn" id="btnRight">→</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight * 0.60;

const V_WIDTH = 1200;
const V_HEIGHT = 800;
const SCALE = canvas.height / V_HEIGHT;

function getRandomColor() {
    return `hsl(${Math.random() * 360}, 70%, 60%)`;
}

let currentLevel = 1;
let isHost = false;
let players = { self: { id: 'me', x: 100, y: 100, vX: 0, vY: 0, w: 50, h: 50, color: getRandomColor(), name: '?', ground: false, jumpCount: 0 } };
let world = { platforms: [], lava: [], finishLine: 4000 };
let connections = {};
let peer;
const keys = { left: false, right: false };

function generateLevel(lv) {
    document.getElementById('level-display').innerText = "LEVEL: " + lv;
    if(lv > 15) { alert("OYUN BİTTİ!"); location.reload(); return; }
    world.platforms = [{ x: 0, y: 700, w: 400, h: 100 }];
    let lastX = 400;
    for (let i = 0; i < 15 + lv; i++) {
        let gap = 150 + (Math.random() * 100) + (lv * 5);
        let width = 200 - (lv * 5);
        let y = 400 + (Math.sin(i) * 200);
        world.platforms.push({ x: lastX + gap, y: y, w: width, h: 40 });
        lastX += gap + width;
    }
    world.finishLine = lastX + 100;
    world.platforms.push({ x: world.finishLine, y: 600, w: 300, h: 200 });
    players.self.x = 100; players.self.y = 100;
}

const shortID = 'ZORT-' + Math.random().toString(36).substr(2, 4).toUpperCase();
peer = new Peer(shortID);
peer.on('open', id => document.getElementById('my-id-box').innerText = "ID: " + id);

peer.on('connection', conn => {
    isHost = true;
    connections[conn.peer] = conn;
    setupDataHandler(conn);
});

function setupDataHandler(conn) {
    conn.on('data', data => {
        if (data.type === 'sync') {
            if (!players[data.id]) players[data.id] = { id: data.id, x: data.x, y: data.y, w: 50, h: 50, color: data.color, name: data.name };
            players[data.id].x = data.x; players[data.id].y = data.y;
            if(isHost) { for(let id in connections) if(id !== data.id) connections[id].send(data); }
        }
        if (data.type === 'chat') {
            displayChat(data.name, data.msg, data.color);
            if(isHost) { for(let id in connections) if(id !== conn.peer) connections[id].send(data); }
        }
        if (data.type === 'lvUp') { currentLevel = data.level; generateLevel(currentLevel); }
    });
}

function startGame() {
    players.self.name = document.getElementById('usernameInput').value || "Oyuncu";
    const targetID = document.getElementById('peer-id-input').value;
    if (targetID) {
        const conn = peer.connect(targetID);
        connections[targetID] = conn;
        setupDataHandler(conn);
    }
    document.getElementById('setup').style.display = 'none';
    generateLevel(currentLevel);
    requestAnimationFrame(gameLoop);
}

function update() {
    let p = players.self;
    if (keys.left) p.vX = -10; else if (keys.right) p.vX = 10; else p.vX *= 0.8;
    p.vY += 1.2; p.x += p.vX; p.y += p.vY;
    p.ground = false;
    world.platforms.forEach(plat => {
        if (p.x + p.w > plat.x && p.x < plat.x + plat.w) {
            if (p.y + p.h > plat.y && p.y + p.h < plat.y + p.vY + 10 && p.vY >= 0) {
                p.y = plat.y - p.h; p.vY = 0; p.ground = true; p.jumpCount = 0;
            }
        }
    });
    if (p.x > world.finishLine + 50) {
        currentLevel++; generateLevel(currentLevel);
        for (let id in connections) connections[id].send({ type: 'lvUp', level: currentLevel });
    }
    if (p.y > V_HEIGHT + 200) { p.x = 100; p.y = 100; p.vY = 0; }
    for (let id in connections) {
        if (connections[id].open) connections[id].send({ type: 'sync', id: peer.id, x: p.x, y: p.y, name: p.name, color: p.color });
    }
}

function gameLoop() {
    update();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(SCALE, SCALE);
    ctx.translate(-(players.self.x - 400), 0);
    world.platforms.forEach(plat => {
        ctx.fillStyle = "#2c3e50"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = "#27ae60"; ctx.fillRect(plat.x, plat.y, plat.w, 10);
    });
    ctx.fillStyle = "white"; ctx.fillRect(world.finishLine + 100, 400, 10, 200);
    ctx.fillStyle = "red"; ctx.fillRect(world.finishLine + 110, 400, 50, 30);
    for (let id in players) {
        let p = players[id];
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "white"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
        ctx.fillText(p.name, p.x + p.w/2, p.y - 10);
    }
    ctx.restore();
    requestAnimationFrame(gameLoop);
}

// CHAT SİSTEMİ (Hatalar düzeltildi)
const chatInput = document.getElementById('chat-input');
const chatMsgs = document.getElementById('chat-messages');
const chatSendBtn = document.getElementById('chat-send-btn');

function displayChat(name, msg, color) {
    const m = document.createElement('div');
    m.innerHTML = `<b style="color:${color}">${name}:</b> ${msg}`;
    chatMsgs.appendChild(m);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function sendMessage() {
    const msg = chatInput.value.trim();
    if (msg !== "") {
        displayChat("Siz", msg, players.self.color);
        for (let id in connections) {
            if (connections[id].open) connections[id].send({ type: 'chat', name: players.self.name, msg: msg, color: players.self.color });
        }
        chatInput.value = "";
        chatInput.blur();
    }
}

chatSendBtn.onclick = sendMessage;
chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

// KONTROLLER
window.addEventListener('keydown', e => {
    if(document.activeElement === chatInput) return;
    if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
    if ((e.key === 'w' || e.key === ' ' || e.key === 'ArrowUp')) {
        let p = players.self;
        if (p.ground) { p.vY = -25; p.ground = false; p.jumpCount = 1; }
        else if (p.jumpCount < 2) { p.vY = -22; p.jumpCount = 2; }
    }
});
window.addEventListener('keyup', e => {
    if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
});

const btnAction = (id, action) => {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { 
        if(action === 'jump') {
            let p = players.self;
            if (p.ground) { p.vY = -25; p.ground = false; p.jumpCount = 1; }
            else if (p.jumpCount < 2) { p.vY = -22; p.jumpCount = 2; }
        } else keys[action] = true; 
    };
    el.onpointerup = () => { if(action !== 'jump') keys[action] = false; };
    el.onpointerleave = () => { if(action !== 'jump') keys[action] = false; };
};
btnAction('btnLeft', 'left'); btnAction('btnRight', 'right'); btnAction('btnUp', 'jump');
</script>
</body>
</html>
